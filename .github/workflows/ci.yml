name: CI THÉRÈSE V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Revue 0.40 : la release APPELLE cette CI et attend son verdict avant de
  # builder - plus de publication possible sans tests verts sur le tag.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer Ruff
        run: pip install ruff

      - name: Lint (Ruff)
        # Inclut tests/ depuis le 08/07 : la suite de tests est linte-clean,
        # on garde ce contrat (sinon le lint des tests dérive en silence).
        run: ruff check src/backend/ tests/

  backend-tests:
    name: Tests Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      THERESE_ENV: test
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer dépendances système
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Installer UV et dépendances
        run: pip install uv && uv sync --dev

      - name: Tests unitaires (pytest)
        shell: bash
        run: |
          # GitHub Actions lance `shell: bash` avec -eo pipefail : sans ce
          # set +e, l echec de pytest tuait le script AVANT la lecture de
          # $?. Le job devenait rouge (c est bien), mais la branche du code
          # 124 n etait jamais atteinte et l avertissement promis sur les
          # threads orphelins ne pouvait pas s afficher. Verifie le
          # 01/09/2026 en rejouant le script sous bash --noprofile -eo pipefail.
          set +e
          # 04/09/2026 : la suite a atteint 97 % avant d etre coupee au
          # plafond historique de 8 min. Le seuil de session passe a 12 min ;
          # le timeout de 30 s par test continue de detecter les vrais blocages.
          timeout 720 uv run pytest tests/ src/backend/tests/ --ignore=tests/e2e -q --timeout=30 -p no:cacheprovider --junitxml=pytest-ci.xml
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 124 ]; then
            echo "::warning::pytest tué après 12 min (possible threads orphelins)"
            exit 1
          fi
          exit $EXIT_CODE
        timeout-minutes: 14

      - name: Nommer les tests rouges (le junit, pas la console tronquee)
        if: failure()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as E, pathlib
          f = pathlib.Path("pytest-ci.xml")
          if not f.exists():
              print("pas de pytest-ci.xml : pytest n a pas atteint la fin de session"); raise SystemExit(0)
          r = E.parse(f).getroot(); s = r if r.tag == "testsuite" else r[0]
          print(f"tests={s.get('tests')} failures={s.get('failures')} errors={s.get('errors')} skipped={s.get('skipped')}")
          for tc in r.iter("testcase"):
              for k in ("failure", "error"):
                  n = tc.find(k)
                  if n is not None:
                      print(f"::error::{k} {tc.get('classname')}::{tc.get('name')} : {(n.get('message') or '')[:300]}")
          EOF

      - name: Archiver le junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ github.sha }}
          path: pytest-ci.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Installer dépendances
        run: npm ci

      - name: Tests (Vitest)
        run: npm run test -- --run

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security-audit:
    name: Audit sécurité (dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # US-018 : audits BLOQUANTS sur les dépendances de production (les
      # `|| true` rendaient ces étapes décoratives). Toute exception est
      # explicite et justifiée ci-dessous, jamais silencieuse.
      - name: Audit NPM (prod, high + critical) - BLOQUANT
        working-directory: src/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Installer pip-audit et uv
        run: pip install pip-audit uv

      # Exceptions documentées (état au 07/07/2026, à réviser à chaque bump) :
      # - torch 2.9.1 : PYSEC-2026-139 / CVE-2025-3000 / CVE-2025-3001 -
      #   fix = torch 2.10, bump non trivial (PyInstaller 3 OS + version CPU
      #   épinglée dans release.yml). Surface réduite : modèle local fixe.
      # - transformers 4.57.6 : PYSEC-2025-217 / CVE-2026-1839 / CVE-2026-4372 -
      #   fix = 5.x, saut majeur à planifier avec le bump torch 2.10 (PyInstaller
      #   3 OS + embeddings). Surface réduite : usage local via sentence-transformers.
      # - starlette 1.2.1 : PYSEC-2026-248 (spoofing request.url) / PYSEC-2026-249
      #   (limites form-urlencoded ignorées, DoS) - fix = 1.3.x, mais son TestClient
      #   passe à httpx2 et désynchronise les requêtes longues de la suite locale
      #   (AttributeError ByteStream.write). Surface réduite : serveur strictement
      #   loopback 127.0.0.1 + token de session. Bump à faire à froid, hors release.
      # - torch 2.9.1 : PYSEC-2026-2286 (nouvel avis 15/07/2026) - même dette que
      #   ci-dessus, fix = 2.10, à traiter dans le bump groupé torch+transformers.
      # - transformers 4.57.6 : PYSEC-2026-2290 (avis 15/07/2026, AUCUNE version
      #   corrigée publiée à ce jour) - surveiller, même lot que le bump torch.
      # État au 15/07/2026 (OPT) : pillow 12.3.0, setuptools 83.0.0 et
      #   soupsieve 2.8.4 bumpés au lieu d'être ignorés (correctifs sans risque).
      # État au 02/09/2026 (B-256) : pypdf 6.15.0 BUMPÉ (>=6.16.1, lock 6.16.2)
      #   plutôt qu'ignoré - CVE-2026-84309 / -84310 / -84311 fermées sans dette.
      # - transformers 4.57.6 : CVE-2026-9856 - fix = 5.10.0, soit le saut de
      #   MAJEURE déjà en dette ci-dessus. Ignorée dans CE lot parce que la 5.x
      #   demande de revalider les embeddings nomic-embed-text-v1.5 et la
      #   compatibilité de sentence-transformers (mêmes poids, même dimension,
      #   trust_remote_code) sur les 3 OS packagés : à traiter dans le bump
      #   groupé torch 2.10 + transformers 5.x, pas dans un lot « CI verte ».
      #   Surface réduite : usage local hors ligne (TRANSFORMERS_OFFLINE=1).
      - name: Audit Python (prod) - BLOQUANT avec exceptions justifiées
        shell: bash
        run: |
          pip-audit -r <(uv export --no-hashes --no-dev) --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln CVE-2025-3001 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2286 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln CVE-2026-9856

  mypy:
    name: Typage (mypy, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer UV et les dépendances de typage sans CUDA
        # Le 04/09/2026, `uv sync --dev` a consommé tout le budget de 10 min
        # en téléchargeant les roues NVIDIA de torch, avant même de lancer
        # mypy. On garde ici les dépendances métier : les omettre change le
        # nombre d'erreurs du cliquet (987 -> 1595 mesuré sur macOS).
        # `--prune torch` retire torch ET ses dépendances CUDA de l'export ;
        # la roue CPU épinglée, déjà utilisée par la release, rétablit ensuite
        # le même environnement de types sans plusieurs gigaoctets inutiles.
        run: |
          pip install uv
          uv venv --python 3.13
          uv export --dev --locked --prune torch --no-emit-project --no-hashes --output-file /tmp/requirements-mypy.txt
          uv pip install --no-deps --requirements /tmp/requirements-mypy.txt
          uv pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu --no-deps

      # US-018 (graduel) : la dette mypy existante est figée en BASELINE.
      # Une PR qui AJOUTE des erreurs de typage passe au rouge ; faire
      # baisser le compteur met à jour la baseline ci-dessous.
      # Revue adversariale : mypy sort en exit 1 dès qu'il y a des erreurs ;
      # avec le set -e/pipefail du shell bash de GitHub Actions, l'assignation
      # tuait le step AVANT la comparaison (job rouge à chaque run). Capture
      # avec || true, comptage par grep ' error:', et garde anti-fail-open
      # (sortie vide ou crash mypy = rouge, pas vert).
      - name: mypy - BLOQUANT au-delà de la baseline
        shell: bash
        env:
          # B-128 : posée à 1004 le 24/08/2026 comme « compte VRAI », alors que
          # le compte réel du runner était plus bas - l'écart devenait du mou, et
          # la comparaison `-gt` laissait passer autant d'erreurs neuves qu'il y
          # avait d'écart, sans un mot. Le cliquet exige désormais l'ÉGALITÉ :
          # une amélioration force la mise à jour du chiffre, donc le mou ne peut
          # plus se reconstituer en silence.
          #
          # 1001 = compte mesuré SUR CE RUNNER (ubuntu-latest), run 33664976637,
          # commit 1b3a40fc. La mesure fraîche locale sur macOS en donne 1002 :
          # l'écart de plateforme est réel, c'est le chiffre du runner qui vaut
          # ici. Aucun cache mypy n'est restauré dans ce job : la mesure est
          # fraîche par construction.
          MYPY_BASELINE: "986"
        run: |
          # `--no-sync` est indispensable : sans lui, `uv run` resynchronise
          # le projet complet et réintroduit les dépendances CUDA évitées à
          # l'étape précédente.
          mypy_out=$(uv run --no-sync mypy src/backend/app --ignore-missing-imports --no-error-summary 2>&1) || true
          if [ -z "$mypy_out" ] || printf '%s' "$mypy_out" | grep -q "INTERNAL ERROR\|Traceback"; then
            echo "::error::mypy n'a pas produit de sortie exploitable (crash ?)"
            printf '%s\n' "$mypy_out" | head -20
            exit 1
          fi
          count=$(printf '%s\n' "$mypy_out" | grep -c ' error:' || true)
          echo "mypy : $count erreurs (baseline $MYPY_BASELINE)"
          if [ "$count" -gt "$MYPY_BASELINE" ]; then
            echo "::error::mypy a dépassé la baseline ($count > $MYPY_BASELINE) - de nouvelles erreurs de typage ont été introduites"
            printf '%s\n' "$mypy_out" | grep ' error:' | tail -20
            exit 1
          fi
          if [ "$count" -lt "$MYPY_BASELINE" ]; then
            echo "::error::mypy est descendu sous la baseline ($count < $MYPY_BASELINE) - recale le cliquet : mets MYPY_BASELINE à $count dans .github/workflows/ci.yml"
            exit 1
          fi

  rust:
    name: Rust (Tauri - clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Installer dépendances Linux (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      # Le build script Tauri exige le sidecar (externalBin) ET le dossier
      # frontendDist ../dist (la feature par défaut custom-protocol embarque
      # les assets : tauri-codegen panique si le dossier manque - revue
      # adversariale). Des factices suffisent pour analyser le code Rust.
      - name: Sidecar et dist factices
        working-directory: src/frontend/src-tauri
        run: |
          mkdir -p binaries && touch binaries/backend-x86_64-unknown-linux-gnu && chmod +x binaries/backend-x86_64-unknown-linux-gnu
          mkdir -p ../dist && touch ../dist/index.html
          # tauri.linux.conf.json est auto-chargé sur Linux : ses globs de
          # resources (backend-libs) doivent matcher au moins un fichier
          mkdir -p binaries/backend-libs/_internal
          touch binaries/backend-libs/backend binaries/backend-libs/_internal/factice

      - name: Clippy - BLOQUANT (zéro warning)
        working-directory: src/frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings
