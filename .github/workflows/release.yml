name: Release THÉRÈSE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version (ex: v0.1.0-alpha) ; à blanc, un libellé a-blanc-..."
        required: true
      dry_run:
        # Construit les trois installeurs et passe toutes leurs gardes, sans
        # créer ni release ni tag ni publier quoi que ce soit.
        description: "À blanc : construire et vérifier les installeurs, ne rien publier"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  preflight:
    name: Vérifier la clé de signature updater
    runs-on: ubuntu-latest
    steps:
      - name: Le mode à blanc ne vise aucune release
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            a-blanc-*) echo "Mode à blanc : construction et vérification seules, aucune publication." ;;
            *) echo "::error::À blanc, le libellé doit commencer par a-blanc- (reçu : $TAG)"; exit 1 ;;
          esac
      - name: La clé de signature updater est-elle présente ?
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent. L'updater (createUpdaterArtifacts) exige la cle privee de signature. Ajoute les secrets TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD au repo avant de tagger (voir docs/UPDATER-SETUP.md)."
            exit 1
          fi
          echo "Cle de signature updater presente."

  # Revue 0.40 : la release n'attendait pas la CI (lancées en parallèle sur le
  # tag) - rien n'empêchait de publier avant le verdict des tests. La CI
  # complète est désormais un prérequis du build.
  ci:
    name: CI complète (gate de release)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # B-158 : un échec des contrats d'API et des parcours de bout en bout
  # bloque la release, comme la CI.
  e2e:
    name: Parcours de bout en bout (gate de release)
    uses: ./.github/workflows/tests-e2e.yml
    secrets: inherit

  sources-copyleft:
    name: Assembler et joindre les sources correspondantes
    needs:
    - preflight
    - ci
    - e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
    - name: Vérifier le manifeste des sources
      # Bloc littéral obligatoire : en scalaire simple, YAML replie les deux
      # lignes en une seule commande et argparse refuse les arguments en trop.
      run: |-
        python scripts/copyleft_sources.py verifier
        python scripts/system_libraries.py check
    - name: Assembler les sources et vérifier leurs empreintes
      run: |-
        python scripts/copyleft_sources.py assembler .work-t2/sources-copyleft
        tar -czf .work-t2/THERESE-sources-copyleft.tar.gz -C .work-t2/sources-copyleft .
        python scripts/system_libraries.py assemble-sources .work-t2/sources-systeme-linux
        tar -czf .work-t2/THERESE-sources-systeme-linux.tar.gz -C .work-t2/sources-systeme-linux .
    - name: Joindre les sources au brouillon de la même version
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        RELEASE_BODY: |
          ## THÉRÈSE ${{ github.event.inputs.tag || github.ref_name }}

          Installeurs disponibles ci-dessous.

          ### Notes
          - **IMPORTANT (depuis 0.23)** : au premier lancement, ta base de données est chiffrée (SQLCipher). Une version antérieure à 0.23 ne pourra plus la lire : ne reviens pas en arrière après ce premier lancement. Tes backups (Paramètres → Données) contiennent tout ce qu'il faut pour restaurer, y compris la clé - protège ces fichiers comme la base elle-même.
          - **Mises à jour automatiques (depuis 0.23)** : l'app vérifie les nouvelles versions au lancement puis toutes les 6 h et propose l'installation en un clic.
          - **macOS** : Clic droit → Ouvrir → Confirmer (app non signée). Si le backend ne démarre pas, ouvre le Terminal et lance : `xattr -cr /Applications/THERESE.app` puis relance l'app.
          - **Windows** : Exclure l'app de l'antivirus si faux positif PyInstaller
          - **Linux** : Installer avec `sudo dpkg -i therese_*.deb`
      run: |-
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          printf '%s' "$RELEASE_BODY" > .work-t2/sources-release-notes.md
          gh release create "$RELEASE_TAG" --draft --prerelease --title "THÉRÈSE $RELEASE_TAG" --notes-file .work-t2/sources-release-notes.md
        fi
        gh release upload "$RELEASE_TAG" .work-t2/THERESE-sources-copyleft.tar.gz .work-t2/THERESE-sources-systeme-linux.tar.gz --clobber

  build:
    name: Build ${{ matrix.platform.name }}
    needs: [preflight, ci, e2e, sources-copyleft]
    # Toutes les gates doivent réussir. Seule exception, à blanc : les sources
    # copyleft (téléchargées chez les amonts, ffmpeg.org injoignable le
    # 07/11/2026) ne bloquent pas la construction des installeurs, rien ne
    # sortant de ce mode ; leur job tourne et rend quand même son verdict.
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' && needs.ci.result == 'success'
      && needs.e2e.result == 'success'
      && (needs.sources-copyleft.result == 'success' || inputs.dry_run) }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary-ext: ""
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary-ext: ".exe"
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary-ext: ""

    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Libérer espace disque et ajouter swap (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Nettoyage agressif ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/heroku
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/edge_driver
          sudo rm -rf /imagegeneration /opt/actionarchivecache
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== Swap 14 Go ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 14G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "=== État ==="
          swapon --show && free -h && df -h /

      - name: Installer dépendances Linux (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      # ---- Python + PyInstaller ----
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Épinglé sur la version des catalogues relus : "3.13" résout 3.13.18
          # sur ubuntu-22.04 depuis fin octobre 2026 (3.13.17 sur macOS et
          # Windows), et la garde d'inventaire refuserait ces octets.
          python-version: "3.13.17"

      - name: Installer UV et dépendances Python
        # --extra voice-local : embarque faster-whisper + Piper dans le sidecar
        # (voix locale « un clic », les modèles restent téléchargés au 1er usage)
        run: pip install uv && uv sync --frozen --dev --extra voice-local

      - name: Installer torch CPU-only (réduction ~1 Go)
        if: runner.os != 'macOS'
        shell: bash
        # US-018 : version ÉPINGLÉE sur celle d'uv.lock - sans ==, chaque
        # release embarquait le dernier torch CPU publié (build non
        # reproductible, et divergent de la version testée en CI).
        run: |
          echo "=== Remplacement de torch par la version CPU-only (épinglée) ==="

          python scripts/install_cpu_torch.py

      - name: Contrôler les licences tierces
        run: |
          python scripts/third_party_licenses.py check
          python scripts/copyleft_sources.py verifier
          python scripts/system_libraries.py check
      - name: Préparer la signature Apple ou ad hoc
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/sign_macos.py prepare
      - name: Préparer la signature Microsoft
        id: windows-signing
        if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: python scripts/prepare_windows_signing.py

      - name: Build sidecar (PyInstaller)
        shell: bash
        run: |
          cd src/backend
          if [ "${{ runner.os }}" = "Windows" ]; then
            ../../.venv/Scripts/pyinstaller backend.spec --noconfirm --clean
          else
            ../../.venv/bin/pyinstaller backend.spec --noconfirm --clean
          fi

      - name: Copier le sidecar dans Tauri
        shell: bash
        run: |
          mkdir -p src/frontend/src-tauri/binaries

          if [ "${{ runner.os }}" = "Linux" ]; then
            # BUG-044 : mode onedir Linux
            # PyInstaller produit dist/backend/ (dossier) au lieu de dist/backend (binaire unique)
            # On crée un wrapper shell comme "sidecar" + on copie le dossier dans binaries/backend-libs/

            WRAPPER="src/frontend/src-tauri/binaries/backend-${{ matrix.platform.target }}"
            LIBS_DIR="src/frontend/src-tauri/binaries/backend-libs"

            # Vérifier que l'output onedir existe
            if [ ! -d "src/backend/dist/backend" ]; then
              echo "ERREUR : src/backend/dist/backend/ introuvable (onedir attendu)" >&2
              exit 1
            fi

            # Créer le wrapper shell
            # Note : pas besoin de LD_LIBRARY_PATH explicite en PyInstaller 6.x onedir.
            # Le bootloader PyInstaller configure LD_LIBRARY_PATH vers _internal/ en interne
            # avant de charger Python. Les .so sont dans $LIBS_DIR/_internal/.
            printf '%s\n' \
              '#!/bin/sh' \
              '# THERESE - wrapper backend Linux (PyInstaller onedir, BUG-044)' \
              '# THERESE_BACKEND_LIBS est passe par lib.rs via app.path().resource_dir()' \
              'LIBS_DIR="${THERESE_BACKEND_LIBS:-$(cd "$(dirname "$0")" && pwd)/backend-libs}"' \
              'exec "$LIBS_DIR/backend" "$@"' \
              > "$WRAPPER"
            chmod +x "$WRAPPER"
            echo "Wrapper shell créé : $WRAPPER"

            # Copier le CONTENU du dossier onedir dans backend-libs/
            # Attention : cp -r dist/backend backend-libs/ copierait backend/ DANS backend-libs/
            # (crée backend-libs/backend/backend, wrapper pointerait sur un dossier).
            # On copie dist/backend/* pour avoir backend-libs/backend (binaire) directement.
            mkdir -p "$LIBS_DIR"
            cp -r src/backend/dist/backend/. "$LIBS_DIR/"
            chmod +x "$LIBS_DIR/backend"
            echo "Libs onedir copiés : $LIBS_DIR ($(du -sh "$LIBS_DIR" | cut -f1))"

          else
            # macOS et Windows : mode onefile (comportement actuel)
            SRC="src/backend/dist/backend${{ matrix.platform.binary-ext }}"
            DEST="src/frontend/src-tauri/binaries/backend-${{ matrix.platform.target }}${{ matrix.platform.binary-ext }}"
            cp "$SRC" "$DEST"
            chmod +x "$DEST" 2>/dev/null || true
            echo "Sidecar copié : $DEST ($(du -sh "$DEST" | cut -f1))"

            # Pas besoin de backend-libs sur macOS/Windows (resources vide dans tauri.conf.json)
            # Le dossier backend-libs est uniquement utilisé sur Linux (onedir PyInstaller)
          fi

      - name: Signer et vérifier le moteur macOS
        if: runner.os == 'macOS'
        shell: bash
        run: 'python scripts/sign_macos.py tree src/frontend/src-tauri/binaries/backend-aarch64-apple-darwin

          .venv/bin/python scripts/verify_embedded_macos.py src/frontend/src-tauri/binaries/backend-aarch64-apple-darwin'
      - name: Signer les fichiers Windows avant empaquetage
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder-recurse: true
          files-folder-filter: exe,dll,pyd,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          trace: false
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          files-folder: ${{ github.workspace }}/src/frontend/src-tauri/binaries

      - name: Inventorier les bibliothèques réellement embarquées
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            .venv/Scripts/python.exe scripts/system_libraries.py inventory --platform "${{ runner.os }}"
          else
            .venv/bin/python scripts/system_libraries.py inventory --platform "${{ runner.os }}"
          fi

      - name: Libérer espace après PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Purge Python pour libérer RAM et disque avant Rust ==="
          rm -rf src/backend/dist src/backend/build
          rm -rf .venv
          pip cache purge 2>/dev/null || true
          # Conserver Python setup-python pour les gardes après Tauri.
          echo "=== Espace disponible ==="
          free -h && df -h /

      # ---- Node.js ----
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Installer dépendances frontend
        working-directory: src/frontend
        run: npm ci --ignore-scripts

      # ---- Rust ----
      - name: Setup Rust
        # B-1115 : épinglé par empreinte (branche stable du 24/09/2026) ; la
        # chaîne n'est plus déduite du nom de branche, d'où `toolchain`.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (révision du 2026-09-03)
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src/frontend/src-tauri
          save-if: "true"

      - name: Installer mold (linker rapide - Linux)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Optimisations compilation Rust (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Mode économie RAM : LTO off, 1 job Cargo ==="
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=2" >> $GITHUB_ENV
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=1" >> $GITHUB_ENV
          echo "NODE_OPTIONS=--max-old-space-size=3072" >> $GITHUB_ENV

      - name: Optimisations sccache (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        shell: bash

      # ---- Monitoring RAM (Linux) ----
      - name: Monitorer la RAM pendant le build (Linux)
        if: runner.os == 'Linux'
        run: |
          (while true; do echo "$(date +%H:%M:%S) | $(free -h | awk '/Mem:/{print "RAM: "$3"/"$2}') | $(free -h | awk '/Swap:/{print "Swap: "$3"/"$2}')"; sleep 30; done) &
          echo $! > /tmp/ram_monitor.pid
        shell: bash

      - name: Vérifier backend-libs (Linux debug)
        if: runner.os == 'Linux'
        run: |
          echo "=== Contenu backend-libs ==="
          ls -la src/frontend/src-tauri/binaries/backend-libs/ | head -20
          echo "=== Taille totale ==="
          du -sh src/frontend/src-tauri/binaries/backend-libs/
          echo "=== Config Linux ==="

      # ---- Build Tauri ----
      - name: Build THÉRÈSE (Tauri)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        with:
          projectPath: src/frontend
          includeUpdaterJson: false
          args: ${{ runner.os == 'Linux' && '--bundles deb --config src-tauri/tauri.linux.conf.json --config src-tauri/updater-ci.conf.json' || runner.os == 'Windows' && '--config src-tauri/updater-ci.conf.json
            --config src-tauri/signing-ci.conf.json' || '--config src-tauri/updater-ci.conf.json' }}
      - name: Finaliser la signature macOS
        if: runner.os == 'macOS'
        run: python scripts/sign_macos.py finish src/frontend/src-tauri/target/release/bundle
      - name: Signer les installeurs Windows finaux
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder-recurse: true
          files-folder-filter: exe,dll,pyd,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          trace: false
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          files-folder: ${{ github.workspace }}/src/frontend/src-tauri/target/release/bundle
      - name: Vérifier les licences dans les installeurs
        shell: bash
        # macOS et Windows ouvrent le moteur onefile avec PyInstaller, présent
        # seulement dans .venv ; sur Linux, .venv est purgé avant Rust.
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            .venv/Scripts/python.exe scripts/verify_packaged_licenses.py --platform "${{ runner.os }}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            .venv/bin/python scripts/verify_packaged_licenses.py --platform "${{ runner.os }}"
          else
            python scripts/verify_packaged_licenses.py --platform "${{ runner.os }}"
          fi

      - name: Vérifier Authenticode
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify_windows_signing.ps1 -Roots @('src/frontend/src-tauri/binaries', 'src/frontend/src-tauri/target/release/bundle')

      - name: Vérifier la signature du bundle macOS complet
        if: runner.os == 'macOS'
        run: |
          APP="src/frontend/src-tauri/target/release/bundle/macos/THERESE.app"
          test -f "$APP/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Le sceau statique ne charge pas le Python extrait par le onefile.
      # Exécuter le sidecar FINAL signé, jamais celui d'avant tauri-action.
      - name: Recette du sidecar signé dans le bundle macOS
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('src/frontend/src-tauri/tauri.conf.json'))['version'])")"
          python3 scripts/recette-macos.py \
            src/frontend/src-tauri/target/release/bundle/macos/THERESE.app \
            "$VERSION" --output "$RUNNER_TEMP/recette-macos" --timeout 180

      - name: Conserver les preuves de la recette macOS
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recette-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recette-macos/
          if-no-files-found: warn

      # P-099 (décision de Ludo, 24/09/2026) : recette du paquet .deb PRODUIT,
      # porte de la release. B-948 ne se voyait qu'en ouvrant le paquet publié.
      # Le script extrait le .deb, le rend non inscriptible comme /usr/lib,
      # vérifie docx/parts, pptx/oxml, pptx/shapes, démarre le moteur et génère
      # un DOCX avec pied de page. Un échec rend le job rouge : la release ne se
      # publie pas (étape 4 de /release-therese). Calibré sur 0.74.0 (rouge) et
      # 0.74.1 (vert).
      - name: Recette du paquet .deb (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          DEB="$(find src/frontend/src-tauri/target -path '*bundle/deb/*.deb' | head -1)"
          VERSION="$(python3 -c "import json; print(json.load(open('src/frontend/src-tauri/tauri.conf.json'))['version'])")"
          echo "Paquet : $DEB ; version attendue : $VERSION"
          bash scripts/recette-deb.sh "$DEB" "$VERSION"


      - name: Publier les artefacts vérifiés
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_BODY: '## THÉRÈSE ${{ github.event.inputs.tag || github.ref_name }}


            Installeurs disponibles ci-dessous.


            ### Notes

            - **IMPORTANT (depuis 0.23)** : au premier lancement, ta base de données est chiffrée (SQLCipher). Une version antérieure à 0.23 ne pourra plus la lire : ne reviens pas en arrière
            après ce premier lancement. Tes backups (Paramètres → Données) contiennent tout ce qu''il faut pour restaurer, y compris la clé - protège ces fichiers comme la base elle-même.

            - **Mises à jour automatiques (depuis 0.23)** : l''app vérifie les nouvelles versions au lancement puis toutes les 6 h et propose l''installation en un clic.

            - **macOS** : Clic droit → Ouvrir → Confirmer (app non signée). Si le backend ne démarre pas, ouvre le Terminal et lance : `xattr -cr /Applications/THERESE.app` puis relance l''app.

            - **Windows** : Exclure l''app de l''antivirus si faux positif PyInstaller

            - **Linux** : Installer avec `sudo dpkg -i therese_*.deb`

            '
        run: python scripts/publish_release_artifacts.py src/frontend/src-tauri/target/release/bundle --platform "${{ runner.os }}"

  manifeste-updater:
    name: Assembler le manifeste updater sans alias Linux dangereux
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Préparer puis publier le manifeste validé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,body,publishedAt,assets > release-assets.json
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir signatures
          VERSION=$(python3 -c 'import json; print(json.load(open("src/frontend/package.json"))["version"])')
          python3 scripts/nettoyer_latest_json.py latest.json --release-assets release-assets.json --signatures signatures --version "$VERSION"
          gh release upload "$RELEASE_TAG" latest.json --clobber
