# 01/09/2026 : les 192 tests Playwright de tests/e2e/stories/ etaient maintenus
# jusqu'au 30/08 et n'avaient AUCUN lanceur — ni script npm, ni job CI. Une
# ceinture de securite affichee et jamais bouclee.
#
# Workflow volontairement SEPARE de ci.yml, comme tests-windows.yml : il ne
# conditionne pas encore la release. Une fois prouve stable sur quelques runs,
# l'integrer au gate.
name: Tests E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # B-158 : appelé par release.yml comme porte de release.
  workflow_call:

jobs:
  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      THERESE_ENV: test
      TRANSFORMERS_OFFLINE: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Installer les dependances systeme
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Installer UV et le backend
        run: pip install uv && uv sync --dev

      - name: Installer les dependances frontend
        working-directory: src/frontend
        run: npm ci

      - name: Installer les dependances racine (Playwright)
        run: npm ci

      # Le navigateur ET ses dependances systeme : sans --with-deps, chromium
      # se lance mais echoue sur les bibliotheques manquantes du runner.
      - name: Installer chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts lance lui-meme ses DEUX serveurs : un backend
      # jetable sur un port dedie avec un THERESE_DATA_DIR temporaire, et un
      # Vite qui vise ce backend. reuseExistingServer est a false pour ne
      # jamais retomber sur une instance reelle.
      #
      # PERIMETRE : TOUTE la suite du projet `desktop` (B-383, 07/09/2026).
      # Le commentaire precedent annoncait « restreint aux tests d'API » alors
      # que --project=desktop ne restreint que le navigateur : testDir vaut
      # ./tests/e2e/stories, sans testMatch, donc les huit parcours d'interface
      # tournaient aussi. Ils ont ete reecrits pour la coque conversationnelle
      # (parcours 01, 02, 05, 06 le 01-02/09 ; les autres suivaient deja le
      # registre d'actions) : mesure locale du 07/09/2026, 97 tests, les huit
      # parcours verts, deux contrats d'API en depassement de delai a la
      # premiere creation de contact (chargement du modele d'embedding en
      # local, pas une regression). Le projet `mobile` (iPhone 13) reste hors
      # CI : l'application est un logiciel de bureau.
      - name: Parcours et contrats d'API de bout en bout
        run: npx playwright test --project=desktop

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
