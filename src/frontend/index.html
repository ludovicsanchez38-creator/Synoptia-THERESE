<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/therese.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THÉRÈSE - L'assistante souveraine</title>
    <meta name="description" content="THÉRÈSE v2 - L'assistante IA souveraine des entrepreneurs français" />

    <!--
      F-09 : Spinner de démarrage macOS
      Affiché immédiatement dès l'ouverture de la fenêtre WebView,
      avant même le chargement de React/JavaScript.
      Disparaît automatiquement quand React remplace le contenu de #root.
    -->
    <style>
      /* Variables alignées sur le thème THÉRÈSE (repris du CSS global).
         B-063 : elles ne l'étaient pas. Le splash s'affiche avant le bundle,
         il ne peut pas lire globals.css et doit donc en recopier les valeurs
         exactes : fond du thème sombre, accents de marque. Toute divergence
         se voit au montage de React, en saut de couleur.
         Verrouillé par src/styles/splash.test.ts. */
      :root {
        --therese-bg: #0B1226;
        --therese-cyan: #22D3EE;
        --therese-magenta: #E11D8D;
        --therese-text-muted: rgba(255, 255, 255, 0.45);
      }

      /* Reset minimal pour le splash */
      html, body {
        margin: 0;
        padding: 0;
        background: var(--therese-bg);
        height: 100%;
      }

      /* Conteneur du splash inline */
      #therese-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--therese-bg);
        z-index: 9999;
        /* -webkit-app-region requis pour le drag macOS sans barre de titre */
        -webkit-app-region: drag;
        user-select: none;
      }

      /* Polices de l'écran de démarrage.
         Le splash s'affiche AVANT le bundle JS : les imports @fontsource de
         main.tsx n'ont pas encore été évalués. Il lui faut donc ses propres
         fichiers, servis depuis public/. Copies conformes de
         @fontsource/plus-jakarta-sans et @fontsource/inter, vérifiées
         octet pour octet par src/styles/polices.test.ts. */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 700;
        /* swap et non block : « block » masque le texte jusqu'à l'arrivée de
           la police, et le titre porte un dégradé en -webkit-text-fill-color
           transparent. Un splash sans titre pendant trois secondes. */
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/inter-latin-500-normal.woff2') format('woff2');
      }

      /* Titre dégradé animé (pulse) */
      #therese-splash h1 {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 3rem;
        font-weight: 700;
        margin: 0 0 0.25rem;
        background: linear-gradient(135deg, var(--therese-cyan), var(--therese-magenta));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: therese-pulse 2s ease-in-out infinite;
      }

      /* Spinner circulaire macOS-style */
      #therese-splash .therese-spinner {
        width: 28px;
        height: 28px;
        margin-top: 1.5rem;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--therese-cyan);
        border-right-color: var(--therese-magenta);
        border-radius: 50%;
        animation: therese-spin 0.8s linear infinite;
      }

      /* Message de statut */
      #therese-splash .therese-status {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.8rem;
        color: var(--therese-text-muted);
        margin-top: 0.75rem;
      }

      @keyframes therese-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }

      @keyframes therese-spin {
        to { transform: rotate(360deg); }
      }

      /* B-065 : le splash s'affiche AVANT tout JS et avant globals.css (au
         moment mesuré, document.styleSheets.length vaut 1). Sa règle
         universelle de mouvement réduit n'est donc pas encore là : le garde
         doit être ici. Écrit APRÈS les règles animées — à spécificité égale,
         c'est la dernière déclaration qui l'emporte. Même choix que le splash
         React, qui pose déjà animation 'none' (SplashScreen.tsx:243). */
      @media (prefers-reduced-motion: reduce) {
        #therese-splash h1 {
          animation: none;
        }
        #therese-splash .therese-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      F-09 : Le splash inline est visible tant que React n'a pas rendu le contenu.
      React remplace le innerHTML de #root au premier render, effaçant ce splash.
    -->
    <div id="root">
      <div id="therese-splash">
        <h1>THÉRÈSE</h1>
        <div class="therese-spinner" aria-label="Chargement en cours" role="status"></div>
        <p class="therese-status">Démarrage…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
